name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read # to check out the repository
      id-token: write # to publish to PyPI by trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Check that the tag names the version being released
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - name: Check that the project's address replaced the placeholder
        run: |
          if grep -n "github.com/OWNER/" pyproject.toml; then
            echo "::error file=pyproject.toml::set [project.urls] to the repository's address before releasing"
            exit 1
          fi
      - run: uv run --locked pytest
      - run: uv build
      - run: uv publish --trusted-publishing always
