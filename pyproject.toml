[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "halyard-synth"  # the command is halyard
version = "0.1.0"
description = "A one-voice snare and clap synthesizer that renders a text patch to a sampler-ready WAV"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Vittorio Candolo" }]
dependencies = ["numpy>=2.4", "scipy>=1.17"]

[project.optional-dependencies]
audition = ["sounddevice>=0.5"]

[project.scripts]
halyard = "halyard_synth.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "soundfile>=0.14"]

[tool.uv]
required-version = ">=0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running checks (reference renders of long patches)",
]

[tool.ruff]
line-length = 120
