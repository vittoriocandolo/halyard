instrument = "snare"
schema = 1
seed = 1

[body]
tune_hz  = 200.0
level_db = -18.0
damping  = 1.0              # mode i decays ratio^damping times faster
modes = [                   # loudest mode exactly 0 dB
  { ratio = 1.0,   level_db = 0.0 },
  { ratio = 1.593, level_db = -6.0 },
]
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0, ratio = 1.0 },
  { ms = 5.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0,   gain = 0.0 },
  { ms = 1.5,   gain = 1.0 },
  { ms = 20.0,  gain = 0.4 },
  { ms = 80.0,  gain = 0.1 },
  { ms = 160.0, gain = 0.0 },
]

[[noise]]                   # noise[1]
level_db = -14.0
band_hz  = [1200.0, 8000.0]
rattle   = 0.4              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,  gain = 0.0 },
  { ms = 1.5,  gain = 1.0 },
  { ms = 12.0, gain = 0.4 },
  { ms = 40.0, gain = 0.1 },
  { ms = 90.0, gain = 0.0 },
]

[[brush]]                   # brush[1]: a noise layer whose band moves
level_db = -8.0
band_hz  = [1500.0, 9000.0] # at sweep ratio 1
rattle   = 0.3              # 0 … 1, gated at the body's fundamental
sweep = [                   # the band's edges times the ratio
  { ms = 0.0,   ratio = 0.8 },
  { ms = 140.0, ratio = 1.25 },
  { ms = 300.0, ratio = 0.9 },
]
amp = [
  { ms = 0.0,   gain = 0.0 },
  { ms = 40.0,  gain = 1.0 },
  { ms = 150.0, gain = 0.7 },
  { ms = 260.0, gain = 0.25 },
  { ms = 380.0, gain = 0.0 },
]

[drive]
db = 0.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 48000
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak" | "true-peak"
db          = -14.2         # gain in dB, or peak target in dBFS
polarity    = 1
