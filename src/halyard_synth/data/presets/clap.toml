instrument = "snare"
schema = 1
seed = 1

[body]
tune_hz  = 200.0
level_db = -inf
damping  = 1.0              # mode i decays ratio^damping times faster
modes = [                   # loudest mode exactly 0 dB
  { ratio = 1.0, level_db = 0.0 },
]
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0,  ratio = 1.0 },
  { ms = 10.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0,  gain = 0.0 },
  { ms = 1.0,  gain = 1.0 },
  { ms = 50.0, gain = 0.0 },
]

[[noise]]                   # noise[1]
level_db = -4.0
band_hz  = [900.0, 3200.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,    gain = 0.0 },
  { ms = 0.1,    gain = 1.0 },
  { ms = 0.2,    gain = 0.977 },
  { ms = 10.0,   gain = 0.1 },
  { ms = 10.1,   gain = 1.0 },
  { ms = 10.2,   gain = 0.977 },
  { ms = 20.0,   gain = 0.1 },
  { ms = 20.1,   gain = 1.0 },
  { ms = 20.2,   gain = 0.977 },
  { ms = 30.0,   gain = 0.1 },
  { ms = 30.1,   gain = 1.0 },
  { ms = 30.2,   gain = 0.9902 },
  { ms = 53.433, gain = 0.1 },
  { ms = 100.1,  gain = 0.0 },
]

[[noise]]                   # noise[2]
level_db = -12.0
band_hz  = [700.0, 6000.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,   gain = 0.0 },
  { ms = 28.0,  gain = 0.0 },
  { ms = 33.0,  gain = 1.0 },
  { ms = 90.0,  gain = 0.3 },
  { ms = 220.0, gain = 0.0 },
]

[drive]
db = 2.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 48000
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak"
db          = -11.7          # gain in dB, or peak target in dBFS
polarity    = 1
