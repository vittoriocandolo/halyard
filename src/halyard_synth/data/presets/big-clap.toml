instrument = "snare"
schema = 1
seed = 1

[body]
tune_hz  = 185.0
level_db = -inf
damping  = 1.0              # mode i decays ratio^damping times faster
modes = [                   # loudest mode exactly 0 dB
  { ratio = 1.0, level_db = 0.0 },
]
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0, ratio = 1.0 },
  { ms = 5.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0, gain = 0.0 },
  { ms = 0.5, gain = 1.0 },
  { ms = 5.0, gain = 0.0 },
]

[[noise]]                   # noise[1]
level_db = -7.0
band_hz  = [800.0, 2600.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,   gain = 0.0 },
  { ms = 0.1,   gain = 1.0 },
  { ms = 0.2,   gain = 0.977 },
  { ms = 10.0,  gain = 0.1 },
  { ms = 10.1,  gain = 1.0 },
  { ms = 10.2,  gain = 0.977 },
  { ms = 20.0,  gain = 0.1 },
  { ms = 20.1,  gain = 1.0 },
  { ms = 20.2,  gain = 0.977 },
  { ms = 30.0,  gain = 0.1 },
  { ms = 30.1,  gain = 1.0 },
  { ms = 30.2,  gain = 0.9943 },
  { ms = 70.1,  gain = 0.1 },
  { ms = 150.1, gain = 0.0 },
]

[[noise]]                   # noise[2]
