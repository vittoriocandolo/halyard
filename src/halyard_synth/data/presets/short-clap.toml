instrument = "snare"
schema = 1
seed = 1

[body]
tune_hz  = 185.0
level_db = -inf
damping  = 1.0              # mode i decays ratio^damping times faster
modes = [                   # loudest mode exactly 0 dB
  { ratio = 1.0, level_db = 0.0 },
]
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0, ratio = 1.0 },
  { ms = 5.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0, gain = 0.0 },
  { ms = 0.5, gain = 1.0 },
  { ms = 5.0, gain = 0.0 },
]

[[noise]]                   # noise[1]
level_db = -6.0
band_hz  = [900.0, 5000.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,  gain = 0.0 },
  { ms = 0.1,  gain = 1.0 },
  { ms = 0.2,  gain = 0.9672 },
  { ms = 7.0,  gain = 0.1 },
  { ms = 7.1,  gain = 1.0 },
  { ms = 7.2,  gain = 0.9672 },
  { ms = 14.0, gain = 0.1 },
  { ms = 14.1, gain = 1.0 },
  { ms = 14.2, gain = 0.9886 },
  { ms = 34.1, gain = 0.1 },
  { ms = 74.1, gain = 0.0 },
]

[[noise]]                   # noise[2]
level_db = -10.0
band_hz  = [1000.0, 6000.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,  gain = 0.0 },
  { ms = 8.0,  gain = 1.0 },
  { ms = 35.0, gain = 0.35 },
  { ms = 90.0, gain = 0.0 },
]

[drive]
db = 0.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 48000
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak" | "true-peak"
db          = -9.2          # gain in dB, or peak target in dBFS
polarity    = 1
