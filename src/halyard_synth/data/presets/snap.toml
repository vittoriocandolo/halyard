instrument = "snare"
schema = 1
seed = 1

[body]
tune_hz  = 1800.0
level_db = -2.0
damping  = 1.0              # mode i decays ratio^damping times faster
modes = [                   # loudest mode exactly 0 dB
  { ratio = 1.0, level_db = 0.0 },
]
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0, ratio = 1.02 },
  { ms = 3.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0,  gain = 0.0 },
  { ms = 0.1,  gain = 1.0 },
  { ms = 4.0,  gain = 0.4 },
  { ms = 15.0, gain = 0.08 },
  { ms = 40.0, gain = 0.0 },
]

[[noise]]                   # noise[1]
level_db = -6.0
band_hz  = [2000.0, 14000.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,  gain = 0.0 },
  { ms = 0.05, gain = 1.0 },
  { ms = 0.15, gain = 0.7 },
  { ms = 6.0,  gain = 0.25 },
  { ms = 20.0, gain = 0.0 },
]

[drive]
db = 0.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 48000
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak" | "true-peak"
db          = -3.7          # gain in dB, or peak target in dBFS
polarity    = 1
