instrument = "snare"
schema = 1
seed = 1

[body]
tune_hz  = 210.0
level_db = -5.0
damping  = 1.2              # mode i decays ratio^damping times faster
modes = [                   # loudest mode exactly 0 dB
  { ratio = 1.0,   level_db = 0.0 },
  { ratio = 1.593, level_db = -4.0 },
  { ratio = 2.136, level_db = -9.0 },
]
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0,  ratio = 1.1 },
  { ms = 12.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0,   gain = 0.0 },
  { ms = 0.4,   gain = 1.0 },
  { ms = 40.0,  gain = 0.5 },
  { ms = 160.0, gain = 0.15 },
  { ms = 320.0, gain = 0.0 },
]

[[noise]]                   # noise[1]
level_db = -12.0
band_hz  = [1500.0, 16000.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,  gain = 0.0 },
  { ms = 0.05, gain = 1.0 },
  { ms = 0.2,  gain = 0.6 },
  { ms = 3.0,  gain = 0.1 },
  { ms = 8.0,  gain = 0.0 },
]

[[noise]]                   # noise[2]
level_db = -8.0
band_hz  = [2200.0, 11000.0]
rattle   = 0.3              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,   gain = 0.0 },
  { ms = 1.2,   gain = 1.0 },
  { ms = 60.0,  gain = 0.5 },
  { ms = 240.0, gain = 0.18 },
  { ms = 620.0, gain = 0.0 },
]

[[noise]]                   # noise[3]
level_db = -14.0
band_hz  = [900.0, 4500.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,   gain = 0.0 },
  { ms = 3.0,   gain = 1.0 },
  { ms = 90.0,  gain = 0.4 },
  { ms = 280.0, gain = 0.12 },
  { ms = 540.0, gain = 0.0 },
]

[drive]
db = 5.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 48000
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak" | "true-peak"
db          = -17.7         # gain in dB, or peak target in dBFS
polarity    = 1
