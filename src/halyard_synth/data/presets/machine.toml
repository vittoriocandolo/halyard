instrument = "snare"
schema = 1
seed = 1

[body]
tune_hz  = 180.0
level_db = -3.0
damping  = 0.6              # mode i decays ratio^damping times faster
modes = [                   # loudest mode exactly 0 dB
  { ratio = 1.0,  level_db = 0.0 },
  { ratio = 1.83, level_db = -4.0 },
]
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0, ratio = 1.02 },
  { ms = 4.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0,   gain = 0.0 },
  { ms = 0.3,   gain = 1.0 },
  { ms = 25.0,  gain = 0.45 },
  { ms = 90.0,  gain = 0.12 },
  { ms = 170.0, gain = 0.0 },
]

[[noise]]                   # noise[1]
level_db = -9.0
band_hz  = [1800.0, 14000.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,   gain = 0.0 },
  { ms = 0.6,   gain = 1.0 },
  { ms = 30.0,  gain = 0.4 },
  { ms = 110.0, gain = 0.1 },
  { ms = 190.0, gain = 0.0 },
]

[drive]
db = 0.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 48000
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak" | "true-peak"
db          = -9.8          # gain in dB, or peak target in dBFS
polarity    = 1
