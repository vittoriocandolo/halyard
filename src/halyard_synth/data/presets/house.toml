instrument = "snare"
schema = 1
seed = 1

[body]
tune_hz  = 200.0
level_db = -4.0
damping  = 1.0              # mode i decays ratio^damping times faster
modes = [                   # loudest mode exactly 0 dB
  { ratio = 1.0, level_db = 0.0 },
  { ratio = 1.7, level_db = -3.0 },
]
pitch = [                   # ratio to tune_hz; starts at 0 ms, ends at 1
  { ms = 0.0, ratio = 1.12 },
  { ms = 8.0, ratio = 1.0 },
]
amp = [                     # shape: 0 at both ends, highest point exactly 1
  { ms = 0.0,   gain = 0.0 },
  { ms = 0.25,  gain = 1.0 },
  { ms = 15.0,  gain = 0.4 },
  { ms = 60.0,  gain = 0.1 },
  { ms = 120.0, gain = 0.0 },
]

[[noise]]                   # noise[1]
level_db = -12.0
band_hz  = [2000.0, 16000.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,  gain = 0.0 },
  { ms = 0.05, gain = 1.0 },
  { ms = 0.2,  gain = 0.5 },
  { ms = 2.0,  gain = 0.08 },
  { ms = 6.0,  gain = 0.0 },
]

[[noise]]                   # noise[2]
level_db = -7.0
band_hz  = [2500.0, 15000.0]
rattle   = 0.0              # 0 … 1, gated at the body's fundamental
amp = [
  { ms = 0.0,   gain = 0.0 },
  { ms = 0.4,   gain = 1.0 },
  { ms = 40.0,  gain = 0.45 },
  { ms = 140.0, gain = 0.12 },
  { ms = 260.0, gain = 0.0 },
]

[drive]
db = 6.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 48000
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak" | "true-peak"
db          = -14.1         # gain in dB, or peak target in dBFS
polarity    = 1
